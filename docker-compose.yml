services:
  ml-api:
    build: ./ml-api
    user: "${SOC_UID:-1000}:${SOC_GID:-1000}"
    environment:
      MODEL_PATH: /app/models/models.joblib
      ML_API_TOKEN: ${ML_API_TOKEN:?Set ML_API_TOKEN in .env}
    ports:
      - "${SOC_BIND_IP:-192.168.99.15}:8001:8001"
    volumes:
      - ./ml-api/models:/app/models:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  ml-train:
    build: ./ml-api
    profiles: ["tools"]
    user: "${SOC_UID:-1000}:${SOC_GID:-1000}"
    volumes:
      - ./ml-api/models:/app/models
      - ./ml-api/data:/app/data
    command:
      - python
      - -m
      - app.train
      - --input
      - /app/data/dataset_features.csv
      - --output
      - /app/models/models.joblib
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp

  ml-export:
    build: ./ml-api
    profiles: ["tools"]
    user: "${SOC_UID:-1000}:${SOC_GID:-1000}"
    environment:
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASS: ${WAZUH_INDEXER_PASS:-}
      WAZUH_INDEXER_VERIFY_TLS: ${WAZUH_INDEXER_VERIFY_TLS:-true}
      WAZUH_INDEXER_CA_CERT: ${WAZUH_INDEXER_CA_CERT:-}
      WAZUH_INDEXER_INDEX: ${WAZUH_INDEXER_INDEX:-wazuh-alerts-*}
      EXPORT_HOURS: ${EXPORT_HOURS:-24}
    volumes:
      - ./ml-api/data:/app/data
      - ./infra/certs:/app/certs:ro
    command:
      - python
      - -m
      - app.export_alerts
      - --hours
      - "${EXPORT_HOURS:-24}"
      - --output
      - /app/data/alerts.jsonl
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp

  response-api:
    build: ./response-api
    environment:
      SOC_API_TOKEN: ${SOC_API_TOKEN:?Set SOC_API_TOKEN in .env}
      WINRM_ENABLED: ${WINRM_ENABLED:-false}
      WINRM_ALLOWED_HOSTS: ${WINRM_ALLOWED_HOSTS:-}
      WINRM_PORT: ${WINRM_PORT:-5986}
      WINRM_TRANSPORT: ${WINRM_TRANSPORT:-ntlm}
      WINRM_USER: ${WINRM_USER:-}
      WINRM_PASS: ${WINRM_PASS:-}
      WINRM_CA_CERT: ${WINRM_CA_CERT:-}
      WINRM_ALLOWED_USERS: ${WINRM_ALLOWED_USERS:-}
      WINRM_ALLOWED_PROCESSES: ${WINRM_ALLOWED_PROCESSES:-}
    volumes:
      - ./infra/certs:/app/certs:ro
    ports:
      - "${SOC_BIND_IP:-192.168.99.15}:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  copilot-api:
    build: ./copilot-api
    environment:
      COPILOT_API_TOKEN: ${COPILOT_API_TOKEN:?Set COPILOT_API_TOKEN in .env}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASS: ${WAZUH_INDEXER_PASS:-}
      WAZUH_INDEXER_VERIFY_TLS: ${WAZUH_INDEXER_VERIFY_TLS:-true}
      WAZUH_INDEXER_CA_CERT: ${WAZUH_INDEXER_CA_CERT:-}
      WAZUH_INDEXER_INDEX: ${WAZUH_INDEXER_INDEX:-wazuh-alerts-*}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    volumes:
      - ./infra/certs:/app/certs:ro
    ports:
      - "${SOC_BIND_IP:-192.168.99.15}:8002:8002"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
