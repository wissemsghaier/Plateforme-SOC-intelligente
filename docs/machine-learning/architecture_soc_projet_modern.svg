<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <style>
      .title { font: 800 34px 'Segoe UI', Arial, sans-serif; fill: #0b1220; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .zoneTitle { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .nodeTitle { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .nodeText { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .ipText { font: 700 13px 'Consolas', 'Courier New', monospace; fill: #0b3b8a; }
      .legend { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .linkA { stroke: #ef4444; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .linkB { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .linkC { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .linkD { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrowPurple); }
      .dashed { stroke-dasharray: 10 8; }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>

    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1050" fill="url(#bg)"/>

  <text x="60" y="60" class="title">Architecture SOC Intelligente - Version Projet Réel</text>
  <text x="60" y="90" class="subtitle">Détection Wazuh + Enrichissement MISP/Cortex + ML + Réponse automatique Linux/Windows + Traçabilité TheHive</text>

  <!-- Network zone -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="1720" height="560" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="65" y="165" class="zoneTitle">Zone réseau et orchestration</text>
  </g>

  <!-- Attacker -->
  <g filter="url(#shadow)">
    <rect x="80" y="220" width="250" height="140" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="100" y="255" class="nodeTitle">Attaquant (Kali Linux)</text>
    <text x="100" y="282" class="ipText">10.10.10.101</text>
    <text x="100" y="308" class="nodeText">Scan / tentative d'attaque</text>
    <text x="100" y="330" class="small">Source simulée de menace</text>
  </g>

  <!-- pfSense -->
  <g filter="url(#shadow)">
    <rect x="420" y="220" width="260" height="140" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="440" y="255" class="nodeTitle">pfSense / IDS-IPS</text>
    <text x="440" y="282" class="ipText">192.168.99.12</text>
    <text x="440" y="308" class="nodeText">Suricata / événements réseau</text>
    <text x="440" y="330" class="small">Forward des logs vers Wazuh</text>
  </g>

  <!-- Ubuntu SOC -->
  <g filter="url(#shadow)">
    <rect x="760" y="185" width="620" height="470" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="785" y="220" class="nodeTitle">Ubuntu SOC (plateforme centrale)</text>
    <text x="785" y="246" class="ipText">192.168.99.15</text>

    <rect x="790" y="270" width="265" height="120" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="810" y="300" class="nodeTitle">Wazuh Manager + API</text>
    <text x="810" y="325" class="nodeText">Règles / corrélation / alertes</text>
    <text x="810" y="347" class="small">Agents + événements Suricata</text>

    <rect x="1085" y="270" width="265" height="120" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="1105" y="300" class="nodeTitle">Wazuh Indexer + Dashboard</text>
    <text x="1105" y="325" class="nodeText">Indexation + visualisation SOC</text>
    <text x="1105" y="347" class="small">Recherche / timeline</text>

    <rect x="790" y="425" width="265" height="120" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="810" y="455" class="nodeTitle">Shuffle (SOAR)</text>
    <text x="810" y="480" class="nodeText">Workflow automatisé</text>
    <text x="810" y="502" class="small">Policy gate + routing OS</text>

    <rect x="1085" y="425" width="265" height="120" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="1105" y="455" class="nodeTitle">response-api + ml-api</text>
    <text x="1105" y="480" class="nodeText">/respond + scoring ML</text>
    <text x="1105" y="502" class="small">WinRM (Windows) + SSH (Linux)</text>
  </g>

  <!-- TheHive + Cortex + MISP -->
  <g filter="url(#shadow)">
    <rect x="1450" y="220" width="260" height="140" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="1470" y="255" class="nodeTitle">TheHive</text>
    <text x="1470" y="282" class="nodeText">Alertes / suivi incident</text>
    <text x="1470" y="304" class="small">tags + statut + trace SOAR</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1450" y="390" width="260" height="140" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1470" y="425" class="nodeTitle">Cortex + MISP</text>
    <text x="1470" y="452" class="nodeText">Enrichissement Threat Intel</text>
    <text x="1470" y="474" class="small">IOC, réputation, contextes</text>
  </g>

  <!-- Targets -->
  <g filter="url(#shadow)">
    <rect x="420" y="430" width="260" height="140" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="440" y="465" class="nodeTitle">Ubuntu cible</text>
    <text x="440" y="492" class="ipText">192.168.99.20</text>
    <text x="440" y="518" class="nodeText">Réponse Linux (SSH)</text>
    <text x="440" y="540" class="small">Isolation / containment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="430" width="250" height="140" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="100" y="465" class="nodeTitle">Windows cible</text>
    <text x="100" y="492" class="ipText">192.168.99.19</text>
    <text x="100" y="518" class="nodeText">Réponse Windows (WinRM)</text>
    <text x="100" y="540" class="small">Blocage / isolation</text>
  </g>

  <!-- Links -->
  <path d="M 330 290 L 420 290" class="linkA"/>
  <path d="M 680 290 L 790 320" class="linkB"/>
  <path d="M 1055 330 L 1085 330" class="linkB"/>
  <path d="M 920 390 L 920 425" class="linkB"/>
  <path d="M 1240 390 L 1240 425" class="linkD"/>

  <path d="M 1055 485 L 1085 485" class="linkC"/>
  <path d="M 1085 505 C 900 620, 650 620, 550 570" class="linkC"/>
  <path d="M 1085 470 C 780 640, 300 640, 210 570" class="linkC"/>

  <path d="M 1350 470 L 1450 470" class="linkD"/>
  <path d="M 1055 455 C 1300 455, 1300 290, 1450 290" class="linkD"/>

  <path d="M 1450 290 C 1360 290, 1360 455, 1350 455" class="linkD dashed"/>

  <!-- Legend -->
  <g filter="url(#shadow)">
    <rect x="40" y="730" width="1720" height="270" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="65" y="770" class="zoneTitle">Légende et flux principaux</text>

    <line x1="70" y1="805" x2="130" y2="805" class="linkA"/>
    <text x="145" y="810" class="legend">Flux attaque: Kali → pfSense / détection réseau</text>

    <line x1="70" y1="840" x2="130" y2="840" class="linkB"/>
    <text x="145" y="845" class="legend">Flux SIEM/SOAR: Wazuh → Shuffle → décision</text>

    <line x1="70" y1="875" x2="130" y2="875" class="linkC"/>
    <text x="145" y="880" class="legend">Flux réponse active: response-api → Ubuntu/Windows (isolation)</text>

    <line x1="70" y1="910" x2="130" y2="910" class="linkD"/>
    <text x="145" y="915" class="legend">Flux CTI &amp; case management: MISP/Cortex + TheHive + traçabilité</text>

    <text x="65" y="960" class="small">Points forts du projet: réponse multi-OS, enrichissement CTI, scoring ML, gouvernance d'alerte TheHive, auditabilité de la réponse.</text>
  </g>
</svg>
