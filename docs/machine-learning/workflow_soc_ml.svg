<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #1e293b; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1500" height="760" fill="#f8fafc"/>

  <text x="60" y="55" class="title">Architecture SOC Intelligent - Workflow SIEM + SOAR + Machine Learning</text>
  <text x="60" y="84" class="subtitle">Detection → Enrichment → ML Scoring → Automated Response → TheHive Traceability</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" rx="14" ry="14" width="250" height="140" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="80" y="165" class="boxTitle">1) Detection</text>
    <text x="80" y="192" class="boxText">Wazuh / Suricata</text>
    <text x="80" y="214" class="boxText">Rule match, alert event</text>
    <text x="80" y="236" class="small">src_ip, dst_ip, rule_id</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="130" rx="14" ry="14" width="250" height="140" fill="#dcfce7" stroke="#4ade80"/>
    <text x="390" y="165" class="boxTitle">2) Normalization</text>
    <text x="390" y="192" class="boxText">Shuffle Python nodes</text>
    <text x="390" y="214" class="boxText">normalize_event</text>
    <text x="390" y="236" class="small">extract_observables</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="130" rx="14" ry="14" width="250" height="140" fill="#fef9c3" stroke="#facc15"/>
    <text x="700" y="165" class="boxTitle">3) Threat Enrichment</text>
    <text x="700" y="192" class="boxText">MISP + Cortex</text>
    <text x="700" y="214" class="boxText">IOC context / reputation</text>
    <text x="700" y="236" class="small">public/private IP handling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="130" rx="14" ry="14" width="250" height="140" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="1010" y="165" class="boxTitle">4) ML Scoring</text>
    <text x="1010" y="192" class="boxText">ml-api</text>
    <text x="1010" y="214" class="boxText">risk score + priority</text>
    <text x="1010" y="236" class="small">LOW / MEDIUM / HIGH / CRITICAL</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="215" y="380" rx="14" ry="14" width="290" height="150" fill="#fee2e2" stroke="#f87171"/>
    <text x="235" y="415" class="boxTitle">5) Decision & Policy Gate</text>
    <text x="235" y="442" class="boxText">Shuffle policy logic</text>
    <text x="235" y="464" class="boxText">approved_by + priority + target_os</text>
    <text x="235" y="486" class="small">Trigger only for critical conditions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="380" rx="14" ry="14" width="290" height="150" fill="#ffe4e6" stroke="#fb7185"/>
    <text x="625" y="415" class="boxTitle">6) Automated Response</text>
    <text x="625" y="442" class="boxText">response-api</text>
    <text x="625" y="464" class="boxText">/respond (Windows) / /respond/linux</text>
    <text x="625" y="486" class="small">isolate / block / containment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="995" y="380" rx="14" ry="14" width="290" height="150" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="1015" y="415" class="boxTitle">7) Case Management</text>
    <text x="1015" y="442" class="boxText">TheHive</text>
    <text x="1015" y="464" class="boxText">Alert update + tags + status</text>
    <text x="1015" y="486" class="small">Traceability and analyst workflow</text>
  </g>

  <!-- Arrows top row -->
  <path d="M 310 200 L 370 200" class="arrow"/>
  <path d="M 620 200 L 680 200" class="arrow"/>
  <path d="M 930 200 L 990 200" class="arrow"/>

  <!-- Arrows down -->
  <path d="M 1115 270 C 1115 320, 800 320, 800 380" class="arrow"/>
  <path d="M 800 530 C 800 560, 1140 560, 1140 530" class="arrow"/>
  <path d="M 650 455 L 505 455" class="arrow"/>

  <!-- KPI footer -->
  <g filter="url(#shadow)">
    <rect x="60" y="610" rx="14" ry="14" width="1380" height="95" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="85" y="645" class="boxTitle">Valeur SOC</text>
    <text x="85" y="673" class="boxText">• MTTR réduit  • Priorisation intelligente  • Réponse standardisée  • Traçabilité complète (audit-ready)</text>
  </g>
</svg>
